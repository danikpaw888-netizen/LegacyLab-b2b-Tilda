<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>LegacyLab — проверка адаптива</title><style>body{margin:0;font:14px Arial;background:#DDE3E9;color:#17212B}header{padding:16px 24px;background:#fff;position:sticky;top:0;z-index:2;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{padding:12px;border:1px solid #aab6c6;background:white;border-radius:5px}button[aria-pressed=true]{background:#2358d5;color:white}#stage{overflow:auto;padding:24px}iframe{border:0;background:white;display:block;margin:auto;height:85vh}output{display:block;padding:16px 24px;background:#fff;font-size:13px}h1{font-size:16px;margin:0}a{color:#2358d5}</style></head><body><header><h1>Проверка адаптива LegacyLab</h1><select id="page" aria-label="Страница"><option value="/">Главная</option><option value="/catalog/">Каталог</option><option value="/equipment/r-450/">R-450</option></select><div id="sizes"></div><button id="scan">Проверить 15 комбинаций</button><a href="/">Открыть сайт</a></header><output id="status">Выберите ширину. Проверка overflow выполняется в реальном браузере только после загрузки страницы. Для запуска тестов используется iframe того же локального сайта.</output><div id="stage"><iframe title="Прототип на выбранной ширине" id="view" src="/" width="1440"></iframe></div><script>
const frame=document.getElementById('view'),page=document.getElementById('page'),status=document.getElementById('status');let width=1440;
for(const n of[1440,1024,768,390,360]){const b=document.createElement('button');b.textContent=n+' px';b.setAttribute('aria-pressed',String(n===width));b.onclick=()=>{width=n;frame.width=n;document.querySelectorAll('#sizes button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));};document.getElementById('sizes').append(b)}
page.onchange=()=>frame.src=page.value;
document.getElementById('scan').onclick=async()=>{const out=[];for(const p of['/','/catalog/','/equipment/r-450/'])for(const n of[1440,1024,768,390,360]){const f=document.createElement('iframe');f.style.cssText='position:absolute;left:-10000px;top:0;height:900px';f.width=n;document.body.append(f);await new Promise(r=>{f.onload=r;f.src=p});await f.contentDocument.fonts.ready;await new Promise(r=>setTimeout(r,150));const d=f.contentDocument,overflow=d.documentElement.scrollWidth>n;out.push(p+' '+n+': '+(overflow?'OVERFLOW '+d.documentElement.scrollWidth:'OK'));f.remove();}status.textContent=out.join(' | ');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out.join('\n')],{type:'text/plain'}));a.download='legacylab-viewport-results.txt';a.textContent=' Скачать результаты';status.append(a);};
</script></body></html>
